<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="The Wings of The Vanguard Society.">
  <title>Wings — The Vanguard Society</title>
  <link rel="stylesheet" href="./css/main.css">
</head>
<body>
  <header data-component="header"></header>
  <main id="main-content">
    <section id="leadership-wing" class="section">
      <div class="container editorial-split">
        <div class="section-header">
          <h2>Leadership Wing</h2>
          <p class="text-secondary font-serif">Empowering the next generation of leaders.</p>
        </div>
        <div>
          <p class="description font-serif dropcap"></p>
          <div class="mt-4">
            <h3>Coordinators</h3>
            <div class="coordinators cards-grid"></div>
          </div>
          <div class="mt-4">
            <h3>Events</h3>
            <div class="events cards-grid"></div>
          </div>
          <div class="mt-4">
            <h3>Resources</h3>
            <div class="resources cards-grid"></div>
          </div>
        </div>
      </div>
    </section>
    <section id="technical-wing" class="section">
      <div class="container editorial-split">
        <div class="section-header">
          <h2>Technical Wing</h2>
          <p class="text-secondary font-serif">Fostering innovation and technical excellence.</p>
        </div>
        <div>
          <p class="description font-serif dropcap"></p>
          <div class="mt-4">
            <h3>Coordinators</h3>
            <div class="coordinators cards-grid"></div>
          </div>
          <div class="mt-4">
            <h3>Events</h3>
            <div class="events cards-grid"></div>
          </div>
          <div class="mt-4">
            <h3>Resources</h3>
            <div class="resources cards-grid"></div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <footer data-component="footer"></footer>
  <div data-component="search-overlay"></div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
