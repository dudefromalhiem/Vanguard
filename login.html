<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Vanguard Society</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  
  <!-- CSS -->
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/typography.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/navigation.css">
  
  <style>
    .login-container {
      max-width: 400px;
      margin: 4rem auto 8rem;
      padding: 2.5rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      position: relative;
    }
    
    .login-container::before, .login-container::after {
      content: '';
      position: absolute;
      top: -1px; left: -1px; right: -1px; bottom: -1px;
      border: 1px solid var(--border-color);
      pointer-events: none;
    }
    .login-container::after {
      top: -4px; left: -4px; right: -4px; bottom: -4px;
      border: 1px solid var(--border-color);
      opacity: 0.5;
    }

    .login-header {
      text-align: center;
      margin-bottom: 2.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border-color);
    }
    .login-header h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }
    .login-header p {
      color: var(--text-secondary);
      font-size: 0.875rem;
      font-family: 'Inter', sans-serif;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }
    .form-group label {
      display: block;
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
    }
    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      transition: border-color var(--transition-fast);
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--primary-color);
    }

    .login-btn {
      width: 100%;
      padding: 1rem;
      background: var(--primary-color);
      color: var(--bg-color);
      border: none;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: background var(--transition-fast);
    }
    .login-btn:hover {
      background: var(--text-primary);
    }
    .login-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .form-error {
      color: var(--error-color, #d32f2f);
      font-size: 0.875rem;
      margin-top: 1rem;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body class="page-login">
  <div data-component="header"></div>
  <div data-component="search-overlay"></div>

  <main class="container">
    <div class="login-container">
      <div class="login-header">
        <h1>Vanguard Gateway</h1>
        <p>Enter your credentials to access the portal.</p>
      </div>
      
      <form id="login-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required autocomplete="email" placeholder="member@vanguard.edu">
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
        </div>
        
        <button type="submit" id="login-submit" class="login-btn">Authenticate</button>
        <div id="login-error" class="form-error"></div>
      </form>
    </div>
  </main>

  <div data-component="footer"></div>

  <!-- Scripts -->
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/pages/login.js"></script>
</body>
</html>
