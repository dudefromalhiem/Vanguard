<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Events organized by The Vanguard Society.">
  <title>Events — The Vanguard Society</title>
  <link rel="stylesheet" href="./css/main.css">
</head>
<body>
  <header data-component="header"></header>
  <main id="main-content">
    <section class="section">
      <div class="container-wide">
        <div class="section-header">
          <h2>Events</h2>
          <p class="text-secondary font-serif">Discover our upcoming and past events.</p>
        </div>
        <form id="event-filters" class="filter-bar">
          <div style="display:flex;gap:1rem;align-items:center;">
            <button type="button" id="upcoming-btn" class="btn btn-primary active">Upcoming</button>
            <button type="button" id="past-btn" class="btn btn-secondary">Past</button>
          </div>
          <div style="display:flex;gap:1rem;align-items:center;">
            <select name="wing" class="form-select" style="width:auto;border:1px solid var(--border-color);padding:0.5rem 1rem;">
              <option value="">All Wings</option>
              <option value="leadership">Leadership</option>
              <option value="technical">Technical</option>
            </select>
            <select name="type" class="form-select" style="width:auto;border:1px solid var(--border-color);padding:0.5rem 1rem;">
              <option value="">All Types</option>
              <option value="workshop">Workshop</option>
              <option value="seminar">Seminar</option>
            </select>
          </div>
        </form>
        <div id="calendar-container"></div>
        <div id="events-list" class="cards-grid"></div>
        <div id="event-detail-modal" class="modal hidden"></div>
      </div>
    </section>
  </main>
  <footer data-component="footer"></footer>
  <div data-component="search-overlay"></div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
