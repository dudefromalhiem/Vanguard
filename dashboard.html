<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanguard - Member Dashboard</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <div data-component="header"></div>

    <main id="main-content">
        <section class="section">
            <div class="container">
                <h2>Member Dashboard</h2>
                
                <div class="dashboard-grid">
                    <div class="card" id="dashboard-stats">
                        <h3>Your Statistics</h3>
                        <div id="stats-container"></div>
                    </div>

                    <div class="card" id="dashboard-notifications">
                        <h3>Notifications</h3>
                        <div id="notifications-container"></div>
                    </div>

                    <div class="card" id="dashboard-events">
                        <h3>Upcoming Events & RSVPs</h3>
                        <div id="events-container"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div data-component="footer"></div>
    <script type="module" src="/js/app.js"></script>
    <script type="module" src="/js/pages/dashboard.js"></script>
</body>
</html>
