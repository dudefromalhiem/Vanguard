<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>if (['localhost', '127.0.0.1'].includes(location.hostname)) document.write('<script src="http://' + location.hostname + ':35729/livereload.js?snipver=1"><\/script>');</script>
  <meta name="description" content="News from The Vanguard Society.">
  <title>News — The Vanguard Society</title>
  <link rel="stylesheet" href="./css/main.css">
</head>
<body>
  <header data-component="header"></header>
  <main id="main-content">
    <section class="section">
      <div class="container-wide">
        <div class="section-header">
          <h2>News & Updates</h2>
          <p class="text-secondary font-serif">Live headlines from multiple news outlets, refreshed every 20 minutes.</p>
        </div>
        <div id="filter-bar" class="filter-bar">
          <select id="news-filter" class="form-select" style="width:auto;border:1px solid var(--border-color);padding:0.5rem 1rem;">
            <option value="">All Categories</option>
            <option value="geopolitics">Geopolitics</option>
            <option value="international">International Relations</option>
            <option value="national">National</option>
            <option value="state">State</option>
          </select>
        </div>
        <div id="news-container" class="cards-grid"></div>
        <section id="article-container" class="editorial-split" style="display:none;"></section>
      </div>
    </section>
  </main>
  <footer data-component="footer"></footer>
  <div data-component="search-overlay"></div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
