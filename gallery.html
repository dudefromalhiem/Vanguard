<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>if (['localhost', '127.0.0.1'].includes(location.hostname)) document.write('<script src="http://' + location.hostname + ':35729/livereload.js?snipver=1"><\/script>');</script>
  <meta name="description" content="Gallery of The Vanguard Society.">
  <title>Gallery — The Vanguard Society</title>
  <link rel="stylesheet" href="./css/main.css">
</head>
<body>
  <header data-component="header"></header>
  <main id="main-content">
    <section class="section">
      <div class="container">
        <div class="section-header">
          <h2>Gallery</h2>
          <p>Explore our visual history and events.</p>
        </div>
        
        <div class="filter-bar" id="filter-bar">
          <select id="wing-select" class="form-select">
            <option value="">All Wings</option>
          </select>
          <select id="year-select" class="form-select">
            <option value="">All Years</option>
          </select>
        </div>
        
        <div id="gallery-grid" class="cards-grid">
          <div id="albums-grid"></div>
        </div>
      </div>
    </section>
    
    <div id="lightbox" class="modal hidden"></div>
  </main>
  <footer data-component="footer"></footer>
  <div data-component="search-overlay"></div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
