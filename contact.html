<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact The Vanguard Society.">
  <title>Contact — The Vanguard Society</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <header data-component="header"></header>
  <main id="main-content">
    <section id="contact-info" class="section">
      <div class="container">
        <div class="section-header">
          <h2>Contact Us</h2>
          <p>Get in touch with The Vanguard Society for any inquiries or collaborations.</p>
        </div>
        <p>Email: contact@vanguardsociety.org</p>
      </div>
    </section>
    
    <section id="contact-form-section" class="section">
      <div class="container">
        <form id="contact-form">
          <div class="form-group">
            <label class="form-label" for="contact-name">Your Name</label>
            <input type="text" id="contact-name" name="name" class="form-input" placeholder="Your Name" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="contact-email">Your Email</label>
            <input type="email" id="contact-email" name="email" class="form-input" placeholder="Your Email" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="contact-message">Message</label>
            <textarea id="contact-message" name="message" class="form-textarea" placeholder="Message" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Send Message</button>
        </form>
      </div>
    </section>
  </main>
  <footer data-component="footer"></footer>
  <div data-component="search-overlay"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
