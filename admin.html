<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanguard - Admin Dashboard</title>
    <link rel="stylesheet" href="./css/main.css">
</head>
<body>
    <div data-component="header"></div>

    <main id="main-content">
        <section class="section" id="admin-login-section">
            <div class="container">
                <h2>Admin Login</h2>
                <form id="admin-login-form">
                    <div class="form-group">
                        <label class="form-label" for="admin-email">Email</label>
                        <input class="form-input" type="email" id="admin-email" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="admin-password">Password</label>
                        <input class="form-input" type="password" id="admin-password" required>
                    </div>
                    <button class="btn-primary" type="submit">Log In</button>
                    <div id="admin-login-error" class="error-message"></div>
                </form>
            </div>
        </section>

        <section class="section" id="admin-dashboard-section" style="display: none;">
            <div class="container-wide">
                <h2>Admin Dashboard</h2>
                <button class="btn-primary" id="admin-logout-btn">Log Out</button>

                <div class="tabs" id="admin-tabs">
                    <button class="tab-item active" data-target="tab-members">Members</button>
                    <button class="tab-item" data-target="tab-events">Events</button>
                    <button class="tab-item" data-target="tab-applications">Applications</button>
                </div>

                <div class="tab-content">
                    <div class="tab-pane active" id="tab-members">
                        <div class="table-responsive">
                            <table class="table" id="members-table">
                                <thead>
                                    <tr>
                                        <th>Name</th>
                                        <th>Email</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="members-table-body"></tbody>
                            </table>
                        </div>
                    </div>
                    <div class="tab-pane" id="tab-events">
                        <button class="btn-primary" id="btn-create-event">Create Event</button>
                        <div class="table-responsive">
                            <table class="table" id="events-table">
                                <thead>
                                    <tr>
                                        <th>Title</th>
                                        <th>Date</th>
                                        <th>Location</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="events-table-body"></tbody>
                            </table>
                        </div>
                    </div>
                    <div class="tab-pane" id="tab-applications">
                        <div class="table-responsive">
                            <table class="table" id="applications-table">
                                <thead>
                                    <tr>
                                        <th>Applicant</th>
                                        <th>Email</th>
                                        <th>Date</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="applications-table-body"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div data-component="footer"></div>
    <script type="module" src="./js/app.js"></script>
    <script type="module" src="./js/pages/admin.js"></script>
</body>
</html>
