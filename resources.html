<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>if (['localhost', '127.0.0.1'].includes(location.hostname)) document.write('<script src="http://' + location.hostname + ':35729/livereload.js?snipver=1"><\/script>');</script>
  <meta name="description" content="Resources of The Vanguard Society.">
  <title>Resources — The Vanguard Society</title>
  <link rel="stylesheet" href="./css/main.css">
</head>
<body>
  <header data-component="header"></header>
  <main id="main-content">
    <section class="section">
      <div class="container">
        <div class="section-header">
          <h2>Resources</h2>
          <p>Access materials and documents from our events and workshops.</p>
        </div>
        
        <div class="filter-bar" id="filter-bar">
          <input type="text" id="search-input" class="form-input" placeholder="Search resources...">
          <select id="category-select" class="form-select">
            <option value="">All Categories</option>
          </select>
          <select id="wing-select" class="form-select">
            <option value="">All Wings</option>
          </select>
        </div>
        
        <div id="resources-grid" class="cards-grid">
          <div id="resources-list"></div>
        </div>
      </div>
    </section>
  </main>
  <footer data-component="footer"></footer>
  <div data-component="search-overlay"></div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
