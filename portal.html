<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanguard - Member Portal</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <div data-component="header"></div>

    <main id="main-content">
        <section class="section">
            <div class="container">
                <h2>Edit Profile</h2>
                <form id="profile-form">
                    <div class="form-group">
                        <label class="form-label" for="profile-name">Full Name</label>
                        <input class="form-input" type="text" id="profile-name" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="profile-bio">Bio</label>
                        <textarea class="form-input" id="profile-bio" rows="4"></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="profile-linkedin">LinkedIn Profile URL</label>
                        <input class="form-input" type="url" id="profile-linkedin">
                    </div>
                    <button class="btn-primary" type="submit">Save Profile</button>
                    <div id="profile-message" class="message"></div>
                </form>
            </div>
        </section>
    </main>

    <div data-component="footer"></div>
    <script type="module" src="/js/app.js"></script>
    <script type="module" src="/js/pages/portal.js"></script>
</body>
</html>
