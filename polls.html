<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Polls in The Vanguard Society.">
  <title>Polls — The Vanguard Society</title>
  <link rel="stylesheet" href="./css/main.css">
</head>
<body>
  <header data-component="header"></header>
  <main id="main-content">
    <section id="active-polls" class="section">
      <div class="container">
        <div class="section-header" style="display: flex; align-items: center; justify-content: space-between;">
          <div>
            <h2>Active Polls</h2>
            <p>Participate in ongoing discussions and decisions.</p>
          </div>
          <button class="btn btn-primary" id="btn-open-public-poll-modal">+ Create Community Poll</button>
        </div>
        <div id="polls-container" class="cards-grid">
          <div id="active-polls-list"></div>
        </div>
      </div>
    </section>

    <!-- Create Poll Modal for Public/Members -->
    <div class="admin-modal-overlay" id="modal-public-poll">
      <div class="admin-modal-box" style="background: var(--bg-color); color: var(--text-primary); border-top: 4px solid var(--accent-color);">
        <div class="admin-modal-header" style="border-bottom: 1px solid var(--border-color);">
          <h4>Create Community Poll</h4>
          <button class="modal-close-btn" id="btn-close-public-poll-modal">&times;</button>
        </div>
        <form id="form-public-create-poll">
          <div class="form-group">
            <label for="public-poll-question">Poll Question</label>
            <input type="text" id="public-poll-question" required placeholder="What event should Vanguard organize next?">
          </div>
          <div class="form-group">
            <label for="public-poll-options">Poll Options (Comma separated)</label>
            <input type="text" id="public-poll-options" required placeholder="Hackathon, Debate Tournament, AI Workshop">
          </div>
          <div class="form-group">
            <label for="public-poll-duration">How long should this poll stay active?</label>
            <select id="public-poll-duration">
              <option value="24">24 Hours (1 Day)</option>
              <option value="48">48 Hours (2 Days)</option>
              <option value="72">3 Days</option>
              <option value="168">7 Days (1 Week)</option>
              <option value="720">30 Days</option>
            </select>
          </div>
          <div class="form-group">
            <label for="public-poll-file">Upload Image from Device (Optional)</label>
            <input type="file" id="public-poll-file" accept="image/*">
          </div>
          <div class="form-group">
            <label for="public-poll-media-url">Or Media URL (Optional)</label>
            <input type="url" id="public-poll-media-url" placeholder="https://images.unsplash.com/... or YouTube link">
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 1rem;">Launch Poll</button>
        </form>
      </div>
    </div>
    
    <section id="past-polls" class="section">
      <div class="container">
        <div class="section-header">
          <h2>Past Polls</h2>
          <p>Review the results of previous polls.</p>
        </div>
        <div class="cards-grid">
          <div id="past-polls-list"></div>
        </div>
      </div>
    </section>
  </main>
  <footer data-component="footer"></footer>
  <div data-component="search-overlay"></div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
