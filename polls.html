<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Polls in The Vanguard Society.">
  <title>Polls — The Vanguard Society</title>
  <link rel="stylesheet" href="./css/main.css">
</head>
<body>
  <header data-component="header"></header>
  <main id="main-content">
    <section id="official-polls" class="section">
      <div class="container">
        <div class="section-header">
          <h2>Official Society Polls</h2>
          <p>Featured votes and decision-making forums by Vanguard Leadership.</p>
        </div>
        <div class="cards-grid">
          <div id="official-polls-list"></div>
        </div>
      </div>
    </section>

    <section id="create-poll-section" class="section" style="border-top: 1px solid var(--border-color);">
      <div class="container" style="max-width: 800px;">
        <div class="section-header">
          <h2>Create a Community Poll</h2>
          <p>Start an active discussion or poll for the campus community.</p>
        </div>

        <form id="form-public-create-poll">
          <div class="form-group">
            <label class="form-label" for="public-poll-question">Poll Question</label>
            <input type="text" class="form-input" id="public-poll-question" required placeholder="What event or topic should Vanguard organize next?">
          </div>

          <div class="form-group">
            <label class="form-label" for="public-poll-options">Voting Options (Separate with commas)</label>
            <input type="text" class="form-input" id="public-poll-options" required placeholder="AI Workshop, Debate Tournament, Hackathon">
          </div>

          <div class="form-group">
            <label class="form-label" for="public-poll-duration">Active Duration</label>
            <select id="public-poll-duration" class="form-select">
              <option value="24">24 Hours (1 Day)</option>
              <option value="48">48 Hours (2 Days)</option>
              <option value="72">3 Days</option>
              <option value="168">7 Days (1 Week)</option>
              <option value="720">30 Days</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="public-poll-file">Upload Cover Image from Device (Optional)</label>
            <input type="file" class="form-input" id="public-poll-file" accept="image/*">
          </div>

          <div class="form-group">
            <label class="form-label" for="public-poll-media-url">Or Image / Media URL (Optional)</label>
            <input type="url" class="form-input" id="public-poll-media-url" placeholder="https://images.unsplash.com/... or media link">
          </div>

          <button type="submit" class="btn btn-primary" style="margin-top: 1rem;">Create Poll</button>
        </form>
      </div>
    </section>
    
    <section id="past-polls" class="section">
      <div class="container">
        <div class="section-header">
          <h2>Past Polls</h2>
          <p>Review the results of previous polls.</p>
        </div>
        <div class="cards-grid">
          <div id="past-polls-list"></div>
        </div>
      </div>
    </section>
  </main>
  <footer data-component="footer"></footer>
  <div data-component="search-overlay"></div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
